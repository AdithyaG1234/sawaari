# Xcode project for the iPhone app, generated with XcodeGen (`xcodegen` in this folder).
# The app is a thin SwiftUI shell; the screens and logic come from the shared Kotlin module.
name: Sawaari
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sawaari:
    type: application
    platform: iOS
    sources: [Sawaari]
    info:
      path: Sawaari/Info.plist
      properties:
        CFBundleDisplayName: Sawaari
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Compose renders at the screen's full refresh rate (120 Hz on ProMotion iPhones).
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sawaari
        PRODUCT_NAME: Sawaari
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared]
    preBuildScripts:
      - name: Build shared Kotlin code
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
