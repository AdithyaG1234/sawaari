# Xcode project for the iPhone app, generated with XcodeGen (`xcodegen` in this folder).
# The app is a thin SwiftUI shell; the screens and logic come from the shared Kotlin module.
name: Sawaari
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "16.0"
packages:
  # MapLibre for iOS: the same free, open-source map engine the Android app uses.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.20.0"
  # Firebase (group rides): the same project as the Android app.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
settings:
  base:
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "6"
targets:
  Sawaari:
    type: application
    platform: iOS
    sources: [Sawaari]
    dependencies:
      - package: MapLibre
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      # System frameworks the shared Kotlin code uses: SOS texts, crash detection, alerts, beeps.
      - sdk: MessageUI.framework
      - sdk: CoreMotion.framework
      - sdk: UserNotifications.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
    info:
      path: Sawaari/Info.plist
      properties:
        CFBundleDisplayName: Sawaari
        # Only standard HTTPS, so no export-compliance paperwork for each TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.navigation
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Compose renders at the screen's full refresh rate (120 Hz on ProMotion iPhones).
        CADisableMinimumFrameDurationOnPhone: true
        NSLocationWhenInUseUsageDescription: Sawaari shows where you are on the map and shares it with your ride group.
        NSLocationAlwaysAndWhenInUseUsageDescription: While you're in a ride group, Sawaari keeps sharing your location with the group when the screen is off.
        NSMicrophoneUsageDescription: Sawaari records voice notes for your ride group chat while you hold the mic button.
        # Keeps sharing location with the ride group with the screen off, like Android's ride service.
        UIBackgroundModes: [location, audio]
        # Route links shared from Sawaari open in the app: sawaari://route?...
        CFBundleURLTypes:
          - CFBundleURLName: app.sawaari.route
            CFBundleURLSchemes: [sawaari]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sawaari
        PRODUCT_NAME: Sawaari
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared]
    preBuildScripts:
      - name: Build shared Kotlin code
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
