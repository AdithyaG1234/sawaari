name: Build APK

on:
  push:
    branches: [main, "preview/**", "chore/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The GitHub ubuntu runner already ships the Android SDK (ANDROID_HOME),
      # so no separate setup-android step is needed.
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
      - uses: actions/upload-artifact@v5
        with:
          name: sawaari-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # On main, also attach the APK to a "latest-debug" release so it can be downloaded
      # straight onto a phone (Actions artifacts need a GitHub login and come zipped).
      - if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk sawaari-debug.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk sawaari-debug-older-phones.apk
          ls -lh sawaari-debug*.apk
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          prerelease: true
          make_latest: false
          body: |
            Debug APK built automatically from the latest commit on main (${{ github.sha }}).
            Most phones: sawaari-debug.apk. Only if that one won't install (older 32-bit phones): sawaari-debug-older-phones.apk.
          files: |
            sawaari-debug.apk
            sawaari-debug-older-phones.apk
          overwrite_files: true
      # Branch builds go to a separate "preview" release so they can be tried before merging.
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk sawaari-preview.apk && ls -lh sawaari-preview.apk
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Preview build (not merged yet)
          prerelease: true
          make_latest: false
          body: "Preview APK from branch ${{ github.ref_name }} (${{ github.sha }})."
          files: sawaari-preview.apk
          overwrite_files: true
      # A version tag (e.g. v1.0.0) builds the release APK and publishes it as the latest release.
      # The stable download link is https://github.com/AdithyaG1234/sawaari/releases/latest/download/sawaari.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk sawaari.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk sawaari-older-phones.apk
          ls -lh sawaari*.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sawaari ${{ github.ref_name }}
          make_latest: true
          body: |
            Install on most phones: **sawaari.apk**. Only if that one won't install (older 32-bit phones): sawaari-older-phones.apk.
            Open the link in Chrome, tap the file, then Install (choose "Install anyway" if Play Protect asks).
          files: |
            sawaari.apk
            sawaari-older-phones.apk
