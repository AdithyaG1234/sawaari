name: Upload iPhone app to TestFlight

# Builds a signed release of the iPhone app and uploads it to TestFlight (App Store Connect).
# Run it by hand from the Actions tab ("Run workflow"). It needs these repository secrets:
#   APPLE_TEAM_ID          the 10-character Team ID (developer.apple.com, Membership details)
#   APPSTORE_KEY_ID        the App Store Connect API key's Key ID
#   APPSTORE_ISSUER_ID     the Issuer ID shown above the list of keys
#   APPSTORE_KEY_P8        the whole text of the downloaded AuthKey_XXXX.p8 file
# The key needs the Admin role so Xcode can make the signing certificate and profile by itself.

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check the secrets are set
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$P8" ] || missing="$missing APPSTORE_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Pick Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app && xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts') }}
      - name: Generate the Xcode project
        run: chmod +x gradlew && brew install xcodegen && cd iosApp && xcodegen generate
      - name: Save the API key
        env:
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Archive (signed for the App Store)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          # Every upload needs a new build number: use this workflow's run number.
          xcodebuild -project iosApp/Sawaari.xcodeproj -scheme Sawaari -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Sawaari.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 60
      - name: Upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Sawaari.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -n 40
          echo "Uploaded build ${{ github.run_number }}. It shows in App Store Connect, TestFlight after Apple processes it (usually 5 to 30 minutes)."
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
