name: How-to video

# Records the how-to video: builds the app for an emulator, drives it through a real group ride
# (tools/howto-video/drive.py) while recording the screen, and makes the voice-over.
# The clips and voice files are uploaded as the "howto-video-raw" artifact; compose.py turns them into the video.

on:
  push:
    branches: ["video/**"]
    paths: ["tools/howto-video/**", ".github/workflows/howto-video.yml"]
  workflow_dispatch:
    inputs:
      scenes:
        description: "Only these scenes (comma separated), empty for all"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: howto-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Voice-over (Piper, offline text to speech)
        run: |
          pip install -q piper-tts==1.8.0
          mkdir -p voices
          base=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium
          curl -sSL -o voices/v.onnx "$base/en_US-lessac-medium.onnx"
          curl -sSL -o voices/v.onnx.json "$base/en_US-lessac-medium.onnx.json"
          OUT=out python tools/howto-video/narrate.py voices/v.onnx
      - uses: actions/upload-artifact@v5
        with:
          name: howto-video-voice
          path: out/voice/
      # Keep the files on the "howto-video-files" branch too (like ios-screenshots), so they can be fetched with git.
      - name: Save to the howto-video-files branch
        if: always()
        env:
          SUB: voice
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do
            rm -rf files
            git clone -q --depth 1 --branch howto-video-files "$url" files 2>/dev/null || {
              git init -q files && git -C files checkout -q --orphan howto-video-files && git -C files remote add origin "$url"; }
            rm -rf "files/$SUB" && mkdir -p "files/$SUB" && cp -r out/voice/. "files/$SUB/"
            git -C files add -A && git -C files commit -q -m "How-to video $SUB (${{ github.sha }})" || exit 0
            git -C files push -q origin howto-video-files && exit 0
            sleep 5
          done

  record:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the app for the emulator
        run: chmod +x gradlew && ./gradlew assembleDebug -PwithX86=true --stacktrace && ls app/build/outputs/apk/debug/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q uiautomator2==3.2.9
      - name: App signing fingerprint (for the demo riders' Firebase calls)
        run: |
          sha=$(keytool -list -v -keystore app/sawaari-debug.keystore -storepass android -alias androiddebugkey | awk '/SHA1:/ {print $2}' | tr -d ':')
          echo "APP_SHA1=$sha" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SCENES: ${{ inputs.scenes }}
          OUT: out
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -timezone Asia/Kolkata
          script: |
            adb root && sleep 5 && adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            python tools/howto-video/drive.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: howto-video-raw
          path: out/
      # Keep the files on the "howto-video-files" branch too (like ios-screenshots), so they can be fetched with git.
      - name: Save to the howto-video-files branch
        if: always()
        env:
          SUB: raw
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do
            rm -rf files
            git clone -q --depth 1 --branch howto-video-files "$url" files 2>/dev/null || {
              git init -q files && git -C files checkout -q --orphan howto-video-files && git -C files remote add origin "$url"; }
            rm -rf "files/$SUB" && mkdir -p "files/$SUB" && cp -r out/. "files/$SUB/"
            git -C files add -A && git -C files commit -q -m "How-to video $SUB (${{ github.sha }})" || exit 0
            git -C files push -q origin howto-video-files && exit 0
            sleep 5
          done
